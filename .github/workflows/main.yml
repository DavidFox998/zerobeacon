name: Deploy Zerobeacon MF 1000 to Fly.io

on:
  push:
    branches: [main, ci-gate-verify]

jobs:
  test:
    name: Tier-gate tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all tests
        run: |
          pytest test_mcp_tier_gate.py test_stripe_webhook.py test_no_body_api_key.py test_mcp_tool_tiers.py test_admin_reset.py -v --tb=short 2>&1 | tee /tmp/pytest_results.txt
          exit ${PIPESTATUS[0]}

      - name: Write test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/pytest_results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Lane manuals are not in git. Write each one from its repository secret
      # into lane-manuals/ so the Dockerfile's COPY . . carries it into the
      # image, where GET /api/lane-manual serves it to that lane's key only.
      # A missing secret is a loud warning, never a failed deploy: that lane's
      # endpoint answers 503 manual_not_provisioned until the secret is set.
      # Content is never echoed; only the byte count is logged.
      - name: Provision lane manuals from repository secrets
        shell: bash
        env:
          MANUAL_AMAZON: ${{ secrets.MANUAL_AMAZON }}
          MANUAL_PAYPAL: ${{ secrets.MANUAL_PAYPAL }}
          MANUAL_META: ${{ secrets.MANUAL_META }}
        run: |
          mkdir -p lane-manuals
          for lane in amazon paypal meta; do
            var="MANUAL_${lane^^}"
            content="${!var}"
            if [ -z "${content//[[:space:]]/}" ]; then
              echo "::warning title=Lane manual not provisioned::${var} is empty or unset; lane-manuals/${lane}.md was not written. GET /api/lane-manual will answer 503 manual_not_provisioned for the ${lane} lane until the secret is set and the app is redeployed."
              continue
            fi
            printf '%s\n' "$content" > "lane-manuals/${lane}.md"
            echo "lane-manuals/${lane}.md written ($(wc -c < "lane-manuals/${lane}.md") bytes)"
          done

      - name: Deploy to Fly.io
        run: flyctl deploy -a zerobeacon-mf-1000 --remote-only --strategy immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke-test:
    name: Post-deploy smoke test (branded domain)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Wait for Fly.io deploy to go live
        run: sleep 15

      - name: Smoke test — branded domain + RapidAPI trial flow
        run: |
          pytest test_smoke_domain.py test_rapidapi_e2e.py -v --tb=short 2>&1 | tee /tmp/smoke_results.txt
          exit ${PIPESTATUS[0]}

      - name: Smoke test — subdomains (beacon + api)
        run: |
          pytest test_smoke_subdomains.py -v --tb=short 2>&1 | tee /tmp/smoke_subdomain_results.txt
          exit ${PIPESTATUS[0]}

      - name: Write smoke-test summary
        if: always()
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Endpoints: \`/api/mf/01/beacon\` (free) · \`/api/mf/03/delivery_proof\` (pro)" >> $GITHUB_STEP_SUMMARY
          echo "Subdomains: \`beacon.zerobeacon.ai/health\` · \`api.zerobeacon.ai/health\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/smoke_results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Subdomain Health Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/smoke_subdomain_results.txt 2>/dev/null || echo "(no output)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
